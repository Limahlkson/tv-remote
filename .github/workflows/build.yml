name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch offline speech model
        run: |
          curl -fsSL --retry 3 -o model.zip https://alphacephei.com/kaldi/models/vosk-model-small-en-us-0.15.zip
          echo "30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498  model.zip" | sha256sum -c -
          unzip -q model.zip
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/vosk-model-en
          mv vosk-model-small-en-us-0.15 app/src/main/assets/vosk-model-en
          du -sh app/src/main/assets/vosk-model-en

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Show APK contents
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep -E "lib/|assets/" | head -40

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TV-Remote-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-apk
          path: out/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TV Remote v1.0.${{ github.run_number }}
          files: out/*.apk
