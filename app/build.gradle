plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.dave.tvremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dave.tvremote'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // Personal sideload key, kept in the repo so every build can update the last one.
    signingConfigs {
        shared {
            storeFile file('tvremote.keystore')
            storePassword 'tvremote'
            keyAlias 'tvremote'
            keyPassword 'tvremote'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Offline speech recognition (Vosk) with its small English model bundled
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'com.alphacephei:vosk-model-en:0.3.47@aar'
}
